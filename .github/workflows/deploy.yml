name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'ee07860dbb8e61ff6915758785baf89a' }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      # DOCS_ONLY_SKIP: a successful CI run on main normally publishes the Worker.
      # Documentation-only changes must not replace the production Worker.
      # The diff is taken against the release LIVE on Cloudflare (every deploy tags the Worker version with its exact
      # GitHub SHA), not against HEAD^: a code commit followed by a docs commit must still reach production.
      # workflow_dispatch still deploys. Anything that cannot be established (no token, no live tag, live release not
      # fetchable, empty diff) fails open and deploys, so application code is never skipped.
      # Allowlist (keep identical to scripts/validate-system-docs.mjs):
      #   *.md
      #   docs/*
      #   scripts/generate-system-inventory.mjs
      #   scripts/validate-system-docs.mjs
      #   .github/workflows/deploy.yml
      #   .github/workflows/ci.yml
      - name: Detect documentation-only commit
        id: scope
        if: github.event_name == 'workflow_run'
        run: |
          set -uo pipefail
          deploy() { echo "skip=false" >> "$GITHUB_OUTPUT"; echo "$1; Worker deploy will continue."; exit 0; }
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || deploy "No Cloudflare token to read the live release"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/rega24"
          version="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/deployments" | jq -r '.result.deployments[0].versions | max_by(.percentage) | .version_id // empty' 2>/dev/null)" || version=""
          [ -n "$version" ] || deploy "Live version unknown"
          live="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/versions/$version" | jq -r '.result.annotations["workers/tag"] // .result.metadata.annotations["workers/tag"] // empty' 2>/dev/null)" || live=""
          [[ "$live" =~ ^[0-9a-f]{40}$ ]] || deploy "Live version carries no release SHA tag"
          echo "Live release: $live"
          git fetch --quiet --depth=1 origin "$live" || deploy "Live release $live is not fetchable"
          mapfile -t files < <(git diff --name-only "$live" HEAD)
          [ "${#files[@]}" -gt 0 ] || deploy "Empty diff against the live release"
          skip=true
          for f in "${files[@]}"; do
            case "$f" in
              *.md|docs/*|scripts/generate-system-inventory.mjs|scripts/validate-system-docs.mjs|.github/workflows/deploy.yml|.github/workflows/ci.yml)
                echo "docs-only path: $f"
                ;;
              *)
                echo "deploy required: $f"
                skip=false
                ;;
            esac
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Documentation-only commit — Worker not replaced
        if: steps.scope.outputs.skip == 'true'
        run: echo "Skipping npx wrangler deploy. Use workflow_dispatch to publish this SHA deliberately."

      - name: Check Cloudflare credentials
        if: steps.scope.outputs.skip != 'true'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets."
            exit 1
          fi
          echo "Cloudflare credentials are present."

      # P0 isolation: REGA != R&L. Read-only; fails closed before any production-changing step below.
      - name: Project identity guard (REGA only)
        if: steps.scope.outputs.skip != 'true'
        run: node scripts/project-identity-guard.mjs --project REGA --domain www.rega24.com --worker rega24

      - name: Require successful CI for this exact current main SHA (including manual releases)
        if: steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$release_sha" = "$main_sha"
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release_sha&status=completed" --jq '[.workflow_runs[] | select(.head_sha == "'"$release_sha"'" and .event == "push" and .conclusion == "success")] | length')"
          test "$count" -ge 1

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.skip != 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: steps.scope.outputs.skip != 'true'
        run: npm run db:generate

      - name: Build for Cloudflare Workers (OpenNext)
        if: steps.scope.outputs.skip != 'true'
        run: npm run build

      - name: Verify existing production Worker and domains
        if: steps.scope.outputs.skip != 'true'
        run: node scripts/production-target.mjs

      - name: Require verified D1 final snapshot before first cutover
        if: steps.scope.outputs.skip != 'true'
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          D1_CUTOVER_WAIT_MS: "600000"
        run: node scripts/d1-release-readiness.mjs

      - name: Deploy to Cloudflare Workers
        if: steps.scope.outputs.skip != 'true'
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          npx wrangler deploy --tag "$RELEASE_SHA" --message Verified-GitHub-CI-release

      - name: Deployment successful
        if: steps.scope.outputs.skip != 'true'
        run: echo "✅ Production deploy completed successfully after CI."
