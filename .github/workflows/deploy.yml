name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'ee07860dbb8e61ff6915758785baf89a' }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets."
            echo "Add it under Settings → Secrets and variables → Actions → New repository secret."
            echo "Name: CLOUDFLARE_API_TOKEN"
            echo "Value: a Cloudflare API token with Workers Scripts Edit permission."
            exit 1
          fi
          echo "Cloudflare credentials are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build for Cloudflare Workers (OpenNext)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy

      - name: Deployment successful
        run: echo "✅ Production deploy completed successfully."
