name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'ee07860dbb8e61ff6915758785baf89a' }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # DOCS_ONLY_SKIP: shared with the Python workflow; manual dispatch never skips.
      - name: Detect documentation-only commit
        id: scope
        run: node scripts/deploy-scope.mjs

      - name: Documentation-only commit — Worker not replaced
        if: steps.scope.outputs.skip == 'true'
        run: echo "Skipping npx wrangler deploy. Use workflow_dispatch to publish this SHA deliberately."

      - name: Check Cloudflare credentials
        if: steps.scope.outputs.skip != 'true'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets."
            exit 1
          fi
          echo "Cloudflare credentials are present."

      # P0 isolation: REGA != R&L. Read-only; fails closed before any production-changing step below.
      - name: Project identity guard (REGA only)
        if: steps.scope.outputs.skip != 'true'
        run: node scripts/project-identity-guard.mjs --project REGA --domain www.rega24.com --worker rega24

      - name: Verify successful CI for the exact production commit
        if: steps.scope.outputs.skip != 'true'
        run: node scripts/verified-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.skip != 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: steps.scope.outputs.skip != 'true'
        run: npx prisma generate

      - name: Build for Cloudflare Workers (OpenNext)
        if: steps.scope.outputs.skip != 'true'
        run: npm run build

      - name: Recheck current main immediately before deployment
        if: steps.scope.outputs.skip != 'true'
        run: node scripts/verified-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy to Cloudflare Workers
        if: steps.scope.outputs.skip != 'true'
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          npx wrangler deploy --tag "$RELEASE_SHA" --message Verified-GitHub-CI-release --var "REGA_COMMIT_SHA:$RELEASE_SHA" --keep-vars

      - name: Verify active production version, domains, database and anonymous admin protection
        if: steps.scope.outputs.skip != 'true'
        run: node scripts/health/release-proof.mjs

      - name: Deployment successful
        if: steps.scope.outputs.skip != 'true'
        run: echo "✅ Production deploy completed successfully after CI."
