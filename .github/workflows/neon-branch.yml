name: Neon preview policy

# CI already uses an isolated PostgreSQL service (ci.yml). No Neon resource
# creation or deletion is needed for PRs. Keep this manual status workflow so
# the Free plan cannot accumulate unused previews or lose unique preview data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the zero-cost preview policy
        run: |
          echo "PR tests use the disposable PostgreSQL service in CI."
          echo "Automatic Neon branch creation and deletion are disabled."
          echo "Existing branches require a data and ownership audit before deletion."
