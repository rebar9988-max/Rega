name: tmp-lockgen
on:
  push:
    branches: [tmp/lockgen-20261118]
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm install next@16.4.6 --save-exact --ignore-scripts
      - run: npm audit fix --ignore-scripts || true
      - run: npm audit --omit=dev --audit-level=low || true
      - run: npm audit --audit-level=high || true
      - run: git diff --stat
      - run: |
          echo "=====BEGIN====="
          git diff package.json package-lock.json | gzip -9 | base64 -w0
          echo
          echo "=====END====="
