name: tmp-lockgen
on:
  push:
    branches: [tmp/lockgen-20261120]
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: |
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const pages = [['home','/ckb'],['biz','/ckb/businesses'],['about','/ckb/about'],['login','/ckb/login'],['travel','/ckb/travel'],['homeen','/en']];
          for (const [w,h] of [[1440,1100],[390,1500]]) {
            const p = await b.newPage({ viewport: { width: w, height: h }, deviceScaleFactor: 1 });
            for (const [n,u] of pages) {
              try { await p.goto('https://www.rega24.com'+u, { waitUntil: 'networkidle', timeout: 45000 }); } catch(e) { console.log('ERR', n, e.message); }
              await p.waitForTimeout(800);
              await p.screenshot({ path: `${n}-${w}.jpg`, type: 'jpeg', quality: 55 });
            }
          }
          await b.close();
          JS
          node s.mjs
      - run: |
          for f in *.jpg; do echo "=====BEGIN $f====="; base64 -w0 "$f"; echo; echo "=====END $f====="; done
