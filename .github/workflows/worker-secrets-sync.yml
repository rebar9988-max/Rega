name: Sync Worker runtime secrets

# Manual. Copies runtime secrets from GitHub repository secrets to the Cloudflare Worker `rega-platform`
# (the RUNTIME secrets the running Worker reads, as opposed to Workers Builds "build" variables).
# Only secrets that are actually set are sent; empty ones are skipped. Values are masked and never printed.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "sync" to upload the configured secrets to the production Worker'
        required: true

permissions:
  contents: read

jobs:
  sync:
    # Production secrets are only used from the reviewed main branch, never from a feature branch.
    if: inputs.confirm == 'sync' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      S_XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      S_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      S_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      S_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Cloudflare credentials present?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not available to Actions; nothing was changed."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Upload configured secrets (names only in the log)
        run: |
          set -eu
          json="{}"
          for name in DATABASE_URL AUTH_SECRET GEMINI_API_KEY XAI_API_KEY OPENAI_API_KEY GROQ_API_KEY DEEPSEEK_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY; do
            val="$(printenv "S_$name" || true)"
            if [ -n "$val" ]; then
              json="$(jq -c --arg k "$name" --arg v "$val" '. + {($k): $v}' <<<"$json")"
              echo "will set: $name"
            else
              echo "skip (not set in GitHub secrets): $name"
            fi
          done
          if [ "$json" = "{}" ]; then echo "::error::No runtime secrets are configured in GitHub secrets."; exit 1; fi
          printf '%s' "$json" | npx wrangler secret bulk --name rega-platform
