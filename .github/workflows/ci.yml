name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Pull requests: a new push supersedes the running check. main: every commit gets its own complete run, because
# a cancelled main run leaves that commit unverified and Beta health (workflow_run on success) never follows it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rega
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throw-away CI database and dummy secrets. Real keys are never used or needed:
      # E2E talks to a local fake AI server (tests/e2e/fake-ai.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rega
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rega
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Python AI engine tests
        working-directory: services/ai-python
        run: uv run pytest
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Exercise read-only preflight against the throw-away database
        run: node scripts/database-preflight.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (Node, used by E2E)
        run: npm run build:node
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run e2e
      - name: Build for Cloudflare Workers + validate the Worker bundle (no credentials, no deploy)
        run: |
          npm run build
          npx wrangler deploy --dry-run
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
