name: Cloudflare diagnostics

# Read-only. Prints the NAMES of the Worker's secrets/variables and its deployment history, never values.
# Uses the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Cloudflare account IDs are public identifiers, not credentials; repository variable/secret may override this known production account.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'ee07860dbb8e61ff6915758785baf89a' }}
    steps:
      - name: Credentials present?
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not available to this workflow (missing or not exposed as repository secrets). Skipping. Production deploys and the health check do not need them; only this diagnostics job does."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.creds.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - if: steps.creds.outputs.present == 'true'
        name: Worker secrets (names only)
        run: npx wrangler secret list --name rega-platform
      - if: steps.creds.outputs.present == 'true'
        name: Deployments
        run: npx wrangler deployments list --name rega-platform 2>&1 | tail -40
      - if: steps.creds.outputs.present == 'true'
        name: Versions
        run: npx wrangler versions list --name rega-platform 2>&1 | tail -40
