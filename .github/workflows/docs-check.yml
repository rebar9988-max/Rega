name: REGA24 documentation validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/project-identity-guard.mjs --project REGA
      - run: node scripts/rega24-docs.mjs --check
