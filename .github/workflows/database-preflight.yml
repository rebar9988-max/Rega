name: Database preflight (read-only)
on:
  workflow_dispatch:
  push:
    branches: [fix/business-owner-onboarding-2026-10-06]
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/business-owner-onboarding-2026-10-06'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Read schema and migration metadata (no migration or seed)
        run: node scripts/database-preflight.mjs
