name: Isolated business Worker runtime diagnostic
on:
  push:
    branches: [test/business-worker-runtime]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rega
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rega
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rega
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: node scripts/health/worker-smoke.mjs
      - name: Compare the original localhost endpoint on the same Worker
        run: node scripts/health/worker-smoke.mjs --hostname-control
