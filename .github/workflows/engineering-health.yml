name: Engineering health

on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows: ['CI', 'Deploy to Cloudflare Workers', 'Beta health', 'Production browser check']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: engineering-health
  cancel-in-progress: false

jobs:
  review:
    # Standard hosted Linux is free for PUBLIC repositories. Never consume private allowances.
    if: >-
      github.repository == 'rebar9988-max/Rega' &&
      github.event.repository.visibility == 'public' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       (github.event.workflow_run.name == 'Deploy to Cloudflare Workers' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      # github.sha is default-branch code for workflow_run, never failed-head code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: node scripts/project-identity-guard.mjs --project REGA
      - name: Collect bounded evidence and update recovery queue
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const { review } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/automation/review.mjs`);
            await review({ github, context, core });

  dependencies:
    if: >-
      github.repository == 'rebar9988-max/Rega' &&
      github.event.repository.visibility == 'public' &&
      github.event_name != 'workflow_run' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/project-identity-guard.mjs --project REGA
      - run: node scripts/validate-system-docs.mjs
      - run: node --test scripts/automation/*.test.mjs
      # Lockfile audit needs no install, provider keys or application/database execution.
      - run: npm audit --package-lock-only --audit-level=low
