name: Three-page production verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: three-page-production-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check the three deployed pages (read-only)
        run: node scripts/health/three-page-live.mjs
      - name: Measure desktop and mobile Lighthouse
        if: always()
        run: |
          mkdir -p three-page-live/lighthouse
          export CHROME_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          for locale in en ckb; do
            for route in for-business ai locations; do
              for device in mobile desktop; do
                preset=()
                if [ "$device" = desktop ]; then preset=(--preset=desktop); fi
                npx --yes lighthouse@13.5.0 "https://www.rega24.com/$locale/$route" "${preset[@]}" --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="three-page-live/lighthouse/$locale-$route-$device.json" --quiet
              done
            done
          done
      - name: Upload measured results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-page-production-evidence
          path: three-page-live/
          retention-days: 14
