# Read-only visual evidence for the REGA24 3D Glass design migration.
# Lives only on the isolated `design-evidence` branch (never on main). It builds the public source design
# (rebar9988-max/Rega24-3D-Glass-Design), opens it and https://www.rega24.com in Chromium (desktop + mobile,
# LTR + Sorani RTL), and commits the screenshots back to this branch. No secrets, no deploy, no data writes.
name: Design evidence screenshots

on:
  push:
    branches: [design-evidence]
    paths: [label.txt, branch.txt, "tools/**", .github/workflows/design-evidence.yml]

permissions:
  contents: write

concurrency:
  group: design-evidence
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and serve the source design
        run: |
          git clone --depth 1 https://github.com/rebar9988-max/Rega24-3D-Glass-Design src-design
          node tools/patch-source.mjs src-design/src/App.tsx
          cd src-design
          npm install --no-audit --no-fund --legacy-peer-deps
          npx vite build
          nohup npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done

      - name: Build and start the target branch (disposable local D1 test data, never production)
        if: hashFiles('branch.txt') != ''
        env:
          AUTH_SECRET: evidence-only-secret-not-used-anywhere-else
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          DIRECT_DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
        run: |
          git clone --depth 1 --branch "$(cat branch.txt)" "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" target
          cd target
          npm ci --no-audit --no-fund
          npm run db:generate
          npm run build:node
          export D1_SQLITE_PATH="$(node scripts/init-local-d1.mjs --test | tail -1)"
          # Real taxonomy (categories, cities) into the disposable local DB only, so category UI renders.
          REGA_DATABASE_PROVIDER=d1 timeout 600 npm run db:seed > ../seed.log 2>&1 || { echo "seed failed"; tail -20 ../seed.log; }
          REGA_DATABASE_PROVIDER=d1 REGA_PRIVATE_BETA=0 AUTH_SESSION_REVALIDATE_MS=0 nohup npm run start -- -p 3311 > ../target.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3311/api/v1/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3311/api/v1/health || (tail -50 ../target.log; exit 1)
          echo "PR_URL=http://localhost:3311" >> "$GITHUB_ENV"

      - name: Install Playwright
        run: |
          cd tools
          npm install --no-audit --no-fund --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: |
          LABEL=$(cat label.txt)
          OUT="shots/$LABEL" node tools/shoot.mjs

      - name: Commit screenshots to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add shots
          git commit -m "evidence: $(cat label.txt)" || exit 0
          git push
